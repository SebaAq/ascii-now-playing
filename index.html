<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Spotify</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas></canvas>
<script>
// Client ID de tu app en developer.spotify.com (redirect URI: http://127.0.0.1:8888/)
const CLIENT_ID = '9d2ac7946ccb43f0806f7c68019d609d';
const REDIRECT = location.origin + '/';
const SCOPES = 'user-read-playback-state user-modify-playback-state';
const RAMP = ' .\'`^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const MONO = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace'; // igual en cualquier máquina
const FONT = 10, CW = FONT * 0.6, CH = FONT;
const GROW_MS = 3000;
const GAIN = 1.4, MIN_LUM = 0.12; // realce de color; las celdas más oscuras que MIN_LUM no se dibujan

const cv = document.querySelector('canvas'), ctx = cv.getContext('2d');
const src = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
const q = new URLSearchParams(location.search);
const TAP = matchMedia('(pointer: coarse)').matches ? 'Tocá' : 'Clic';
let img = null, cells = [], art = {}, born = 0, sparks = [], tint = { r: 255, g: 255, b: 255 };
let player = null, fetchedAt = 0, msg = '', lyrics = [];

// --- Spotify (PKCE, sin backend) ---

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  localStorage.verifier = verifier;
  location = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES,
  });
}

async function token(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...params }),
  });
  if (!r.ok) {
    // Solo 400/401 dicen que el token no sirve más; 429 y 5xx son pasajeros y el polling reintenta.
    if (r.status !== 400 && r.status !== 401) throw new Error(`Spotify no responde (${r.status}), reintentando...`);
    localStorage.removeItem('refresh');
    throw new Error(`Login falló (${r.status}). ${TAP} para reconectar.`);
  }
  const t = await r.json();
  localStorage.access = t.access_token;
  if (t.refresh_token) localStorage.refresh = t.refresh_token;
  localStorage.expires = Date.now() + t.expires_in * 1000;
}

// Un solo refresh a la vez: Spotify rota el refresh token, y dos en paralelo (polling + teclado) se pisan.
let refreshing = null;

async function api(path, method = 'GET') {
  if (Date.now() > +localStorage.expires - 60000)
    await (refreshing ??= token({ grant_type: 'refresh_token', refresh_token: localStorage.refresh }).finally(() => refreshing = null));
  const r = await fetch('https://api.spotify.com/v1/me/player' + path, { method, headers: { Authorization: 'Bearer ' + localStorage.access } });
  if (!r.ok) throw new Error(`Spotify respondió ${r.status}` + (r.status === 403 ? ' (controlar la reproducción requiere Premium)' : ''));
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null; // 204 = no hay nada sonando
}

// Teclado y gestos comparten esto.
const CMD = { play: ['/play', 'PUT'], pause: ['/pause', 'PUT'], next: ['/next', 'POST'], prev: ['/previous', 'POST'] };
function control(name) {
  api(...CMD[name]).then(() => setTimeout(poll, 300)).catch(err => msg = err.message);
}

async function poll() {
  try {
    const p = await api('');
    fetchedAt = performance.now();
    const url = p?.item?.album?.images?.[0]?.url;
    if (url && url !== player?.item?.album?.images?.[0]?.url) setCover(url);
    if (p?.item?.id && p.item.id !== player?.item?.id) { loadLyrics(p.item); centAvg = hiAvg = 0; } // cada tema arranca con su propio promedio
    player = p; msg = '';
  } catch (e) { msg = e.message; }
}

// Letra de LRCLIB (Spotify no expone letras). Sin letra = no se muestra nada.
// Primero la búsqueda exacta (nombre + artista + álbum + duración ±2 s); si falla, la búsqueda difusa
// con el nombre limpio, quedándose con el resultado de duración más cercana (prefiriendo los sincronizados).
const LRC = 'https://lrclib.net/api/';
// "Song - Remastered 2011", "Song (feat. X)", "Song - Live at..." → "Song"
const cleanName = s => s.replace(/\s+-\s+.*$/, '').replace(/\s*[([](feat|ft|with|con)\.?\s[^)\]]*[)\]]/gi, '').trim() || s;

async function lrc(path, params) {
  for (let i = 0; ; i++) {
    const r = await fetch(LRC + path + '?' + new URLSearchParams(params));
    if (r.status === 404) return null;
    if (r.ok) return r.json();
    // 503 = "server busy, retry in a moment": reintentar a los 1 s y 2 s
    if (r.status !== 503 || i === 2) throw new Error(`LRCLIB ${r.status}`);
    await new Promise(res => setTimeout(res, 1000 * 2 ** i));
  }
}

async function findLyrics(it) {
  const dur = it.duration_ms / 1000, artist = it.artists[0].name, name = cleanName(it.name);
  // si la exacta falla (503 que no se va, etc.) igual se prueba la difusa
  const exact = await lrc('get', { track_name: it.name, artist_name: artist, album_name: it.album.name, duration: Math.round(dur) })
    .catch(e => (console.warn('Falló la búsqueda exacta de la letra:', e), null));
  if (exact?.syncedLyrics) return exact;
  const best = found => found.filter(x => !x.instrumental && (x.syncedLyrics || x.plainLyrics) && Math.abs(x.duration - dur) <= 10)
    .sort((a, b) => !!b.syncedLyrics - !!a.syncedLyrics || Math.abs(a.duration - dur) - Math.abs(b.duration - dur))[0];
  // con el artista; si no, solo por nombre (LRCLIB a veces carga "Fiah, Six Sex" donde Spotify dice otro artista)
  return best(await lrc('search', { track_name: name, artist_name: artist }) ?? [])
    ?? best(await lrc('search', { q: name }) ?? [])
    ?? exact; // exact puede traer solo plainLyrics
}

async function loadLyrics(it) {
  lyrics = [];
  try {
    const hit = await findLyrics(it);
    if (player?.item?.id !== it.id) return; // cambió el tema mientras tanto
    if (hit?.syncedLyrics) {
      lyrics = hit.syncedLyrics.split('\n').map(l => l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/)).filter(Boolean)
        .map(([, m, s, text]) => ({ t: (m * 60 + +s) * 1000, text }));
    } else if (hit?.plainLyrics) { // sin tiempos: se reparte a lo largo del tema, dejando aire al principio y al final
      const lines = hit.plainLyrics.split('\n').map(s => s.trim()).filter(Boolean), d = it.duration_ms;
      lyrics = lines.map((text, i) => ({ t: d * (0.08 + 0.84 * i / lines.length), text }));
    } else console.info('Sin letra en LRCLIB:', it.artists[0].name, '-', it.name);
  } catch (e) { console.warn('No se pudo traer la letra:', e); }
}

// --- Render ASCII ---

function resize() {
  // El canvas va en píxeles físicos para que el texto no salga borroso en pantallas 2x/3x; se dibuja en píxeles CSS.
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${FONT}px ${MONO}`; ctx.textBaseline = 'top';
  const cols = Math.floor(innerWidth / CW), rows = Math.floor(innerHeight / CH) - 6;
  const ar = vid ? vid.videoWidth / vid.videoHeight : 1; // la tapa es cuadrada; el video conserva su proporción
  const w = Math.min(cols * CW, rows * CH * ar), h = w / ar;
  art = { cols: Math.floor(w / CW), rows: Math.floor(h / CH), gw: cols, gh: rows };
  art.x = (innerWidth - art.cols * CW) / 2;
  art.y = (rows - art.rows) * CH / 2;
  art.ox = Math.round(art.x / CW);
  lyrics.forEach(l => delete l.at);
  sparks = Array.from({ length: 80 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * rows * CH, p: Math.random() * 6.28 }));
  if (img || vid) build(false);
}

function setCover(url) {
  const i = new Image();
  i.crossOrigin = 'anonymous';
  i.onload = () => { img = i; build(); };
  i.src = url;
}

// Cada celda guarda su caracter final y un retardo: crece de abajo hacia arriba, como las flores.
function build(animate = true) {
  const { cols, rows } = art;
  src.canvas.width = cols; src.canvas.height = rows;
  src.drawImage(vid ?? img, 0, 0, cols, rows);
  const d = src.getImageData(0, 0, cols, rows).data;
  cells = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = (y * cols + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 256;
    if (lum < MIN_LUM) continue;
    cells.push({ x, y, r: Math.min(r * GAIN, 255), g: Math.min(g * GAIN, 255), b: Math.min(b * GAIN, 255), ch: RAMP[Math.floor(lum * RAMP.length)], d: (1 - y / rows) * 0.75 + Math.random() * 0.25 });
  }
  // el más vivo (claro y saturado): el más claro a secas sale casi siempre blanco por el realce GAIN
  const vivid = c => Math.max(c.r, c.g, c.b) + 2 * (Math.max(c.r, c.g, c.b) - Math.min(c.r, c.g, c.b));
  const v = cells.reduce((m, c) => vivid(c) > vivid(m) ? c : m, cells[0] ?? tint);
  const lift = x => x + (255 - x) * 0.35; // un poco hacia el blanco: un azul puro no se lee sobre negro
  tint = { r: lift(v.r), g: lift(v.g), b: lift(v.b) };
  if (animate) born = performance.now();
}

// --- Video: Spotify no lo expone, así que se captura una pestaña (el videoclip en YouTube, etc.) y se pasa a ASCII en vivo ---

let vid = null, vidErr = '', lastV = 0;

async function video() {
  if (vid) return stopVid();
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const v = document.createElement('video');
    v.muted = true; v.srcObject = s;
    s.getVideoTracks()[0].onended = stopVid; // cortó desde el botón del navegador
    await v.play();
    vid = v; vidErr = ''; resize();
  } catch (e) { vidErr = 'video: ' + e.message; }
}

function stopVid() {
  vid?.srcObject.getTracks().forEach(t => t.stop());
  vid = null; resize();
}

// --- Gestos con la cámara (MediaPipe Hand Landmarker, cargado del CDN recién al apretar g) ---
// Port de gestures.py de github.com/SebaAq/gesture-tracking: misma lógica, mantenerlas iguales.

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task';
const HOLD_MS = 600, COOLDOWN_MS = 1500; // la pose se sostiene HOLD_MS y entre órdenes pasa COOLDOWN_MS
const GESTO_A_ORDEN = { 'puño': 'pause', 'mano abierta': 'play', 'señalar': 'next', 'paz': 'prev', 'rock': 'lock', 'pulgar arriba': 'unlock' };

// GESTOS-BEGIN
const FINGERS = { index: [8, 6, 5], middle: [12, 10, 9], ring: [16, 14, 13], pinky: [20, 18, 17] }; // [punta, PIP, MCP]

function classify(lm) {
  if (lm.length !== 21) throw new Error('Se esperan 21 puntos');
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const up = {};
  for (const [name, [tip, pip]] of Object.entries(FINGERS)) up[name] = d(tip, 0) > d(pip, 0) * 1.15;
  up.thumb = d(4, 5) > d(3, 5) * 1.25; // el pulgar se mueve de costado: se mide contra el nudillo del índice
  const four = [up.index, up.middle, up.ring, up.pinky].join();
  if (four === 'true,true,true,true') return 'mano abierta';
  if (four === 'false,false,false,false')
    return up.thumb && lm[4].y < lm[2].y && lm[2].y < lm[0].y ? 'pulgar arriba' : 'puño';
  if (four === 'true,false,false,false') return 'señalar';
  if (four === 'true,true,false,false') return 'paz';
  if (four === 'true,false,false,true') return 'rock';
  return 'desconocido';
}
// GESTOS-END

// La detección corre en un Worker: en el hilo principal tardaba ~50 ms por cuadro y trababa la animación.
// Worker clásico (no module) porque el cargador de MediaPipe usa importScripts.
const HAND_WORKER = `
let lm;
onmessage = async ({ data }) => {
  if (data.init) {
    try {
      const { HandLandmarker, FilesetResolver } = await import(data.mp + '/vision_bundle.mjs');
      const fs = await FilesetResolver.forVisionTasks(data.mp + '/wasm');
      const opts = delegate => ({ baseOptions: { modelAssetPath: data.model, delegate }, canvas: new OffscreenCanvas(1, 1),
        runningMode: 'VIDEO', numHands: 1, minHandDetectionConfidence: 0.6 });
      try { lm = await HandLandmarker.createFromOptions(fs, opts('GPU')); postMessage({ ready: 'GPU' }); }
      catch { lm = await HandLandmarker.createFromOptions(fs, opts('CPU')); postMessage({ ready: 'CPU' }); }
    } catch (e) { postMessage({ error: e.message }); }
    return;
  }
  // Siempre responde, aunque falle: si no, el hilo principal queda esperando y la detección se congela.
  let hand = null;
  try { hand = lm.detectForVideo(data.frame, data.t).landmarks[0] ?? null; } catch {}
  data.frame.close();
  postMessage({ hand });
};`;
const DETECT_MS = 100; // 10 detecciones por segundo: sobra para poses que se sostienen HOLD_MS

let hands = null, handsBusy = false, handsErr = '', gesture = '', held = {}, lastAct = 0, lastD = 0, locked = false;

async function gestos() {
  if (hands) return stopHands();
  if (handsBusy) return;
  handsBusy = true; handsErr = 'gestos: cargando modelo...';
  let w;
  try {
    w = new Worker(URL.createObjectURL(new Blob([HAND_WORKER], { type: 'text/javascript' })));
    const via = await new Promise((ok, fail) => {
      w.onmessage = ({ data }) => data.error ? fail(new Error(data.error)) : ok(data.ready);
      w.onerror = e => fail(new Error(e.message));
      w.postMessage({ init: true, mp: MP, model: MODEL });
    });
    // 320x240 alcanza: el modelo achica la imagen igual, y menos píxeles es menos trabajo por cuadro.
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 320 }, height: { ideal: 240 } } });
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.srcObject = s;
    await v.play();
    hands = { w, v, s, via, busy: false }; handsErr = '';
    w.onmessage = ({ data }) => { if (hands) { hands.busy = false; onHand(data.hand, performance.now()); } };
  } catch (e) { w?.terminate(); handsErr = 'gestos: ' + e.message; }
  handsBusy = false;
}

function stopHands() {
  hands.s.getTracks().forEach(t => t.stop());
  hands.w.terminate();
  hands = null; gesture = ''; held = {}; locked = false;
}

// Desde draw(): manda un cuadro al Worker si no hay otro en curso. No espera el resultado.
function detect(now) {
  if (hands.busy || now - lastD < DETECT_MS || hands.v.readyState < 2) return;
  hands.busy = true; lastD = now;
  const h = hands;
  createImageBitmap(h.v).then(frame => hands === h ? h.w.postMessage({ frame, t: now }, [frame]) : frame.close(), () => h.busy = false);
}

function onHand(hand, now) {
  gesture = hand ? classify(hand) : '';
  if (gesture !== held.g) held = { g: gesture, since: now }; // cambió la pose: vuelve a contar
  const orden = GESTO_A_ORDEN[gesture];
  if (!orden || held.done || now - held.since < HOLD_MS) return;
  // rock bloquea las órdenes (para mover la mano sin cambiar nada) y pulgar arriba las vuelve a habilitar
  if (orden === 'lock' || orden === 'unlock') { held.done = true; locked = orden === 'lock'; return; }
  if (locked || now - lastAct < COOLDOWN_MS || !player) return;
  held.done = true; // una orden por pose sostenida: señalar no salta temas en loop
  if ((orden === 'pause' && !player.is_playing) || (orden === 'play' && player.is_playing)) return; // Spotify da 403 si ya está así
  lastAct = now;
  control(orden);
}

// --- Audio: beat y efectos. Spotify ya no da beats ni análisis, así que se escucha lo que suena:
// `a` = audio de la PC (compartir pantalla con "audio del sistema": limpio, sin ruido del cuarto) o `m` = micrófono (parlantes). ---

let an = null, ac = null, audioStream = null, audioSrc = '', bins, level = 0, avg = 0, lastBeat = 0, pulse = 0, micErr = '';
let shine = 0, hiAvg = 0, cent = 0, centAvg = 0, tilt = 0, lastLoud = 0, disarm = 0;

function stopAudio() {
  audioStream?.getTracks().forEach(t => t.stop());
  ac?.close();
  an = ac = audioStream = null; audioSrc = ''; level = shine = tilt = disarm = 0;
}

function listen(stream, name) {
  stopAudio();
  audioStream = stream; audioSrc = name;
  ac = new AudioContext();
  an = ac.createAnalyser(); an.fftSize = 1024;
  ac.createMediaStreamSource(stream).connect(an);
  bins = new Uint8Array(an.frequencyBinCount); micErr = '';
  hiAvg = centAvg = 0; lastLoud = performance.now();
}

const RAW_AUDIO = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };

async function mic() {
  if (an) return;
  try { listen(await navigator.mediaDevices.getUserMedia({ audio: RAW_AUDIO }), 'mic'); }
  catch (e) { micErr = 'mic: ' + e.message; }
}

async function pcAudio() {
  if (audioSrc === 'pc') return stopAudio();
  try {
    // El video no se usa pero la captura lo exige; se deja vivo porque cortarlo puede cortar el audio.
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: RAW_AUDIO });
    if (!s.getAudioTracks().length) {
      s.getTracks().forEach(t => t.stop());
      throw new Error('no se compartió audio: marcá "compartir audio del sistema" (Chrome o Edge en Windows)');
    }
    s.getAudioTracks()[0].onended = stopAudio;
    listen(s, 'pc');
  } catch (e) { micErr = 'audio: ' + e.message; }
}

// Beat = los graves (~50-500 Hz, los mics de notebook casi no captan más abajo) superan su promedio del último segundo.
// ponytail: umbrales fijos, ajustar BEAT_MIN / BEAT_RATIO si no pega.
const BEAT_MIN = 0.05, BEAT_RATIO = 1.15;
const SILENCE = 0.1, SILENCE_MS = 1500; // pico del espectro por debajo de SILENCE (0-1) durante SILENCE_MS = silencio (el pico, no el promedio: un bajo solo ocupa pocas bandas)
function beat(now) {
  pulse *= 0.9; shine *= 0.9;
  if (!an) return;
  an.getByteFrequencyData(bins);
  let e = 0, all = 0, hi = 0, w = 0, peak = 0;
  for (let i = 1; i < 256; i++) {
    const v = bins[i];
    all += v; w += v * i; if (v > peak) peak = v;
    if (i <= 10) e += v; else if (i >= 60) hi += v; // graves (hasta ~470 Hz) y agudos (desde ~2,8 kHz)
  }
  e = level = e / 2550;
  if (e > BEAT_MIN && e > avg * BEAT_RATIO && now - lastBeat > 250) { pulse = 1; lastBeat = now; doodle(now); }
  avg = avg * 0.98 + e * 0.02;

  // Agudos (platillos, voces): picos sobre su promedio -> destellos en las estrellas.
  hi /= 196 * 255;
  shine = Math.max(shine, Math.min(1, (hi - hiAvg) * 8));
  hiAvg = hiAvg * 0.98 + hi * 0.02;

  // Silencio: la tapa se desarma en caracteres al azar y se rearma cuando vuelve el sonido.
  if (peak / 255 > SILENCE) lastLoud = now;
  disarm += ((now - lastLoud > SILENCE_MS ? 1 : 0) - disarm) * 0.05;

  // Brillo del sonido respecto de su propio promedio: más agudo que de costumbre = colores más fríos, más grave = más cálidos.
  if (all) {
    const raw = w / all / 255;
    cent = centAvg ? cent * 0.9 + raw * 0.1 : raw;
    centAvg = centAvg ? centAvg * 0.998 + cent * 0.002 : raw; // ponytail: depende de los fps (~8 s a 60); pasar a tiempo real si importa
    tilt = Math.max(-0.3, Math.min(0.3, (cent - centAvg) * 12));
  } else tilt *= 0.95;
}

// En cada beat aparece un dibujito en los márgenes, con un color de la tapa; sube y se apaga.
const DOODLES = [['♪'], ['♫'], ['<3'], ['\\o/'], ['(*)'], ['~~>'], [' . ', '-*-', " ' "], [' /\\ ', '<  >', ' \\/ ']];
const DOODLE_MS = 1500;
let doodles = [];

function doodle(now) {
  const { ox, cols, gw, gh } = art;
  const sides = [[0, ox - 4], [ox + cols, gw - 4]].filter(([a, b]) => b > a);
  const [a, b] = sides[Math.random() * sides.length | 0] ?? [0, gw - 4];
  // El más claro de unas celdas al azar, para que no salga un dibujito apagado.
  const c = Array.from({ length: 8 }, () => cells[Math.random() * cells.length | 0]).filter(Boolean)
    .reduce((m, c) => c.r + c.g + c.b > m.r + m.g + m.b ? c : m, { r: 200, g: 200, b: 200 });
  doodles.push({ s: DOODLES[Math.random() * DOODLES.length | 0], x: (a + Math.random() * (b - a)) * CW, y: Math.random() * (gh - 3) * CH, born: now, rgb: `${c.r},${c.g},${c.b}` });
  if (doodles.length > 30) doodles.shift();
}

function drawDoodles(now) {
  doodles = doodles.filter(d => now - d.born < DOODLE_MS);
  for (const d of doodles) {
    const t = (now - d.born) / DOODLE_MS;
    ctx.fillStyle = `rgba(${d.rgb},${1 - t})`;
    d.s.forEach((line, i) => ctx.fillText(t < 0.08 ? line.replace(/\S/g, () => RAMP[Math.random() * RAMP.length | 0]) : line, d.x, d.y - t * 3 * CH + i * CH));
  }
}

const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;

const progress = now => Math.min(player.progress_ms + (player.is_playing ? now - fetchedAt : 0), player.item.duration_ms);

// La letra va a un lugar al azar de los márgenes negros a los costados de la tapa,
// cortada en renglones para que entre en el margen más ancho.
function place(text) {
  const { gw, gh, ox, cols, rows } = art, LW = 2; // un caracter de la letra ocupa 2 columnas (fuente al doble de las celdas)
  const top = Math.floor(art.y / CH), bottom = top + rows; // filas libres arriba y abajo de la tapa
  // Dónde puede ir: los costados; si no entra (celular: la tapa ocupa todo el ancho), las franjas de arriba y abajo; y si no, cualquier lado.
  const rects = [[0, ox, 0, gh], [ox + cols, gw, 0, gh]].filter(r => r[1] - r[0] >= 26);
  if (!rects.length) rects.push(...[[0, gw, 0, top], [0, gw, bottom, gh]].filter(r => r[3] - r[2] >= 4));
  const [a, b, y0, y1] = rects[Math.random() * rects.length | 0] ?? [0, gw, 0, gh];
  const max = Math.max(10, Math.floor((b - a - 6) / LW));
  const lines = [''];
  for (const w of text.toUpperCase().split(' ')) {
    if (lines.at(-1) && (lines.at(-1) + ' ' + w).length > max) lines.push(w);
    else lines[lines.length - 1] = lines.at(-1) ? lines.at(-1) + ' ' + w : w;
  }
  const w = Math.max(...lines.map(s => s.length)) * LW, h = lines.length * 2;
  // La letra se dibuja una columna a la derecha de x; deja 2 columnas de aire contra el borde y contra la tapa.
  const lo = a + 1, hi = Math.max(lo, b - 3 - w);
  return { lines, x: lo + (Math.random() * (hi - lo + 1) | 0), y: y0 + (Math.random() * Math.max(1, y1 - y0 - h + 1) | 0) };
}

// Cada línea aparece en otro lugar, levemente torcida, entra con un golpe de zoom y se tipea con un cursor de bloque;
// al entrar y al salir tiembla con un glitch RGB (corrimiento por renglón y copias roja y cian).
function say(l, pos, alpha, span) {
  if (!l.text || alpha <= 0) return;
  l.at ??= { ...place(l.text), rot: (Math.random() - 0.5) * 0.1 }; // ±3°
  const age = pos - l.t, a = Math.min(alpha, 1), LW = 2;
  const per = Math.min(90, Math.max(25, span * 0.5 / l.text.length)); // tipea en la primera mitad del renglón
  const glitch = Math.max(0, 1 - age / 160, 1 - a);
  const zoom = 1 + 0.3 * Math.max(0, 1 - age / 180) ** 2;
  const w = Math.max(...l.at.lines.map(s => s.length)) * LW * CW, h = l.at.lines.length * 2 * CH;
  const cx = (l.at.x + 1) * CW + w / 2, cy = l.at.y * CH + h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(l.at.rot); ctx.scale(zoom, zoom); ctx.translate(-w / 2, -h / 2);
  ctx.strokeStyle = `rgba(0,0,0,${0.85 * a})`; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  let j = 0, cur = null;
  l.at.lines.forEach((s, row) => {
    const text = [...s].map(c => {
      const k = (pos - l.t) / per - j++;
      if (k <= 0 && !cur) cur = [row, j - 1];
      return k > 4 || c === ' ' ? c : k > 0 ? RAMP[Math.random() * RAMP.length | 0] : ' ';
    }).join('');
    const x = (Math.random() - 0.5) * glitch * 6 * CW, y = row * 2 * CH;
    if (glitch > 0.05) {
      const d = glitch * 4;
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(255,40,60,${0.7 * a})`; ctx.fillText(text, x - d, y);
      ctx.fillStyle = `rgba(40,220,255,${0.7 * a})`; ctx.fillText(text, x + d, y);
    }
    ctx.shadowBlur = 0; ctx.strokeText(text, x, y); ctx.shadowBlur = 6; // contorno negro: despega la letra si cae sobre el arte
    ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},${a})`; ctx.fillText(text, x, y);
  });
  // El cursor va delante del tipeo; con el renglón completo titila al final, solo en la línea actual.
  const last = l.at.lines.length - 1;
  cur ??= alpha >= 1 && (pos / 400 | 0) % 2 ? [last, l.at.lines[last].length] : null;
  if (cur) {
    ctx.shadowBlur = 0; ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},${0.9 * a})`;
    ctx.fillRect(cur[1] * LW * CW, cur[0] * 2 * CH, LW * CW * 0.9, 2 * CH);
  }
  ctx.restore();
}

function lyric(now) {
  if (!player?.item || !lyrics.length) return;
  const pos = progress(now), i = lyrics.findLastIndex(l => l.t <= pos);
  if (i < 0) return;
  ctx.font = `${FONT * 2}px ${MONO}`;
  ctx.shadowColor = `rgb(${tint.r},${tint.g},${tint.b})`; ctx.shadowBlur = 6;
  const span = (lyrics[i + 1]?.t ?? lyrics[i].t + 4000) - lyrics[i].t;
  if (i > 0) say(lyrics[i - 1], pos, 1 - (pos - lyrics[i].t) / 300, span); // la anterior se va con glitch
  say(lyrics[i], pos, 1, span);
  ctx.shadowBlur = 0;
  ctx.font = `${FONT}px ${MONO}`;
}

function status(now) {
  const it = player?.item;
  if (!it) return ['Nada sonando. Poné algo en Spotify.', ''];
  const pos = progress(now);
  const w = Math.max(10, Math.min(40, Math.floor((innerWidth - 40) / 7.2) - 16)), n = Math.round(pos / it.duration_ms * w); // 7.2 px = un caracter a 12px
  return [
    `${player.is_playing ? '>' : '||'} ${it.name} - ${it.artists?.map(a => a.name).join(', ') ?? ''}`,
    `[${'#'.repeat(n)}${'-'.repeat(w - n)}] ${mmss(pos)} / ${mmss(it.duration_ms)}${TAP === 'Tocá' ? '' : `    espacio: play/pausa   <- ->: tema   ${micErr || (an ? `${audioSrc} [${'#'.repeat(Math.round(level * 10)).padEnd(10, '-')}]${pulse > 0.5 ? ' BEAT' : ''}` : 'm: micrófono · a: audio de la PC')}   ${vidErr || (vid ? 'v: cortar video' : 'v: video')}   ${handsErr || (hands ? `g: cortar gestos (${hands.via}) [${gesture || '-'}]${locked ? ' EN PAUSA (pulgar arriba para seguir)' : ''}` : 'g: gestos')}`}`,
  ];
}

function draw(now) {
  beat(now);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  for (const s of sparks) {
    const a = Math.sin(now / 700 + s.p) + 0.7 * shine;
    if (a > 0.6) { ctx.fillStyle = `rgba(255,255,255,${a - 0.6})`; ctx.fillText(a > 0.9 ? '*' : '.', s.x, s.y); }
  }
  drawDoodles(now);
  // ponytail: reconstruye todas las celdas a ~20 fps; si el GC molesta, reusar el array de celdas.
  if (vid && now - lastV > 50) { build(false); lastV = now; }
  if (hands) detect(now);
  const t = (now - born) / GROW_MS, playing = player?.is_playing;
  for (const c of cells) {
    const k = (t - c.d) * 4;
    if (k <= 0) continue;
    const wave = playing ? 0.85 + 0.1 * Math.sin(now / 250 - c.y * 0.15) + 0.3 * pulse : 0.85;
    ctx.fillStyle = `rgba(${c.r * (1 - tilt)},${c.g},${Math.min(255, c.b * (1 + tilt))},${Math.min(k, 1) * wave * (1 - 0.6 * disarm)})`;
    const ch = k < 1 || Math.random() < 0.002 + 0.06 * pulse + 0.7 * disarm ? RAMP[Math.random() * RAMP.length | 0] : c.ch;
    ctx.fillText(ch, art.x + c.x * CW, art.y + c.y * CH);
  }
  lyric(now);
  ctx.fillStyle = '#eee';
  if (msg && !player) { // sin reproducción el mensaje es lo único que hay para hacer: va al centro
    ctx.font = `bold 18px ${MONO}`; ctx.textAlign = 'center';
    ctx.fillText(msg, innerWidth / 2, innerHeight / 2, innerWidth - 32);
    ctx.textAlign = 'left';
  } else {
    const [l1, l2] = msg ? [msg, ''] : status(now);
    ctx.font = `12px ${MONO}`; ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},0.8)`;
    ctx.fillText(l1, 20, innerHeight - 40);
    ctx.fillText(l2, 20, innerHeight - 22);
  }
  ctx.font = `${FONT}px ${MONO}`;
  requestAnimationFrame(draw);
}

// --- Arranque ---

addEventListener('resize', resize);
addEventListener('keydown', e => {
  if (e.key === 'm') mic();
  if (e.key === 'a') pcAudio();
  if (e.key === 'v') video();
  if (e.key === 'g') gestos();
  if (e.key === 'd') doodle(performance.now()); // prueba sin micrófono
  if (!player) return;
  const cmd = { ' ': player.is_playing ? 'pause' : 'play', ArrowRight: 'next', ArrowLeft: 'prev' }[e.key];
  if (cmd) control(cmd);
});
cv.onclick = () => CLIENT_ID && (localStorage.refresh ? mic() : login());

async function start() {
  try {
    if (q.get('code')) {
      history.replaceState(null, '', REDIRECT);
      await token({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: localStorage.verifier });
    }
    if (!localStorage.refresh) { msg = `${TAP} para conectar Spotify.`; return; }
    poll(); setInterval(poll, 2000);
  } catch (e) { msg = e.message; }
}

resize();
requestAnimationFrame(draw);
if (q.get('img')) setCover(q.get('img')); // demo sin Spotify: ?img=foto.jpg
else if (!CLIENT_ID) msg = 'Falta CLIENT_ID en index.html (ver CLAUDE.md).';
else start();
</script>
</body>
